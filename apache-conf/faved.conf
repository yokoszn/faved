<VirtualHost *:80>
    ServerName faved
    PassEnv FAVED_PUBLIC_HTTPS OIDC_ISSUER OIDC_CLIENT_ID OIDC_CLIENT_SECRET_FILE OIDC_REDIRECT_URI OIDC_ALLOWED_SUBS

    DocumentRoot "/var/www/html/public"

    <IfModule xsendfile_module>
        XSendFilePath "/var/www/html/public"
    </IfModule>

    <IfModule mod_rewrite.c>
        RewriteEngine On

        # Serve existing files or directories directly
        RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -f [OR]
        RewriteCond %{DOCUMENT_ROOT}/dist%{REQUEST_URI} -d
        RewriteRule ^(.*)$ /dist/$1 [L]


        # Redirect '/api' prefixed path to api/index.php
        RewriteRule ^/api(/.*|)$ api/index.php [L]
        RewriteRule ^/content(/.*|)$ api/index.php [L]

        # Redirect all other paths to index.html
        RewriteRule ^ dist/index.html [L]
    </IfModule>

    <Directory "/var/www/html/public">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
